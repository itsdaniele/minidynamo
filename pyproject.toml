[project]
name = "minidynamo"
version = "0.1.0"
description = "A minimal, educational implementation of TorchDynamo"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Inductor's C++ builder (torch.utils.cpp_extension) imports setuptools
    # at kernel-compile time; without it the parity tests and examples fail.
    "setuptools>=82.0.0",
    "torch==2.10.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minidynamo"]
